<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Absen dan Tugas</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#14231f;--mute:#5d6f6a;--line:#dfe6e3;--brand:#0f766e;--brand-ink:#fff;--warn:#b45309;--bad:#b42318;--ok:#15803d;--soft:#e3f1ee;--warnbg:#fdf0d8;--okbg:#dcf3e3}
@media (prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#16201e;--ink:#e8f0ee;--mute:#92a6a1;--line:#263430;--brand:#2dd4bf;--brand-ink:#04211d;--warn:#fbbf24;--bad:#f87171;--ok:#4ade80;--soft:#18312d;--warnbg:#3a2e10;--okbg:#14301e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:0 14px calc(env(safe-area-inset-bottom) + 84px);max-width:560px;margin:0 auto}
header{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 0 8px}
h1{font-size:20px;margin:12px 0 2px}
.sub{color:var(--mute);font-size:14px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.title{font-weight:600;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.stat{font-size:20px;font-weight:700;margin:2px 0 10px}
.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.btn.big{width:100%;padding:14px;font-size:17px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.icon{border:0;background:transparent;color:var(--ink);font-size:20px;padding:6px 10px;cursor:pointer;border-radius:8px}
.icon.txt{font-size:14px;color:var(--mute)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--brand);background:transparent;cursor:pointer;flex:none;color:var(--brand-ink);font-size:15px;line-height:1;padding:0}
.chk.on{background:var(--brand)}
.done .title{text-decoration:line-through;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:transparent;color:var(--mute);padding:9px 4px;font:inherit;font-size:12px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--brand);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 76px);width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:6}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:90vh;overflow-y:auto}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.chkrow{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink);margin:14px 0 0}
.chkrow input{width:22px;height:22px;padding:0}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical}
.sec{font-size:13px;font-weight:700;color:var(--mute);margin:16px 2px 6px;text-transform:uppercase;letter-spacing:.04em}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand)}
.badge{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--ink);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.sub-row{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer}
.sub-row.done .title{text-decoration:line-through;color:var(--mute)}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--brand);margin-top:5px;flex:none}
.dot.on{background:var(--brand)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.metric{background:var(--soft);border-radius:12px;padding:10px 12px}
.metric b{display:block;font-size:22px}
.thumb{width:100%;max-height:220px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.err{color:var(--bad);font-size:14px;min-height:18px;margin-top:8px}
.hide{display:none!important}
#toast{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 80px);max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;z-index:40;display:none;text-align:center}
#toast.show{display:block}
#toast.bad{background:var(--bad);color:#fff}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:50;padding:10px}
#viewer.open{display:flex}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer;margin-top:4px}
</style>
</head>
<body>

<header id="hd" class="hide">
  <div class="grow"><div class="title" id="who"></div><div class="meta" id="role"></div></div>
  <button class="icon" id="btn-ref" aria-label="Muat ulang">↻</button>
  <button class="icon txt" id="btn-out">Keluar</button>
</header>

<section id="login" class="hide">
  <h1>Absen dan Tugas</h1>
  <p class="sub">Masuk dengan akun yang diberikan pemilik.</p>
  <div class="card">
    <label>Email</label>
    <input id="l-email" type="email" autocomplete="username" inputmode="email" autocapitalize="none">
    <label>Kata sandi</label>
    <input id="l-pass" type="password" autocomplete="current-password">
    <div id="l-err" class="err"></div>
    <button class="btn big" id="btn-login" style="margin-top:8px">Masuk</button>
  </div>
</section>

<main id="main"></main>

<button class="fab hide" id="fab" aria-label="Beri tugas">+</button>
<nav id="nav" class="hide"></nav>

<div class="sheet-bg" id="sheet"><div class="sheet" id="sheet-body"></div></div>
<div id="viewer"></div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
var SB_URL="https://nglncmclwuqnwbugiiza.supabase.co";
var SB_KEY="sb_publishable_H__-kFX3d7I3pVYfAqdsQw_-xDVJFnq";

var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

var sb=null,me=null,tab="",dateSel="",monthSel="",cur=null,loadId=0;
var expanded={};
var cache={tasks:{},profiles:[],ring:null,abs:null,tim:[]};

/* ---------- tanggal dan jam (WIB) ---------- */
function todayWIB(){return new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Jakarta"})}
function addDays(d,n){var x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function tglID(d){return new Date(d+"T00:00:00Z").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"})}
function tglPendek(d){return new Date(d+"T00:00:00Z").toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"})}
function bulanID(ym){return new Date(ym+"-01T00:00:00Z").toLocaleDateString("id-ID",{month:"long",year:"numeric",timeZone:"UTC"})}
function addMonth(ym,n){var p=ym.split("-").map(Number);return new Date(Date.UTC(p[0],p[1]-1+n,1)).toISOString().slice(0,7)}
function lastDay(ym){var p=ym.split("-").map(Number);return ym+"-"+String(new Date(Date.UTC(p[0],p[1],0)).getUTCDate()).padStart(2,"0")}
function jam(iso){if(!iso)return "-";return new Date(iso).toLocaleTimeString("id-ID",{timeZone:"Asia/Jakarta",hour:"2-digit",minute:"2-digit",hour12:false}).replace(".",":")}
function menit(a,b){return Math.max(0,Math.round((new Date(b)-new Date(a))/60000))}
function lamaMenit(m){return Math.floor(m/60)+" j "+(m%60)+" m"}
function durasi(a,b){return (a&&b)?lamaMenit(menit(a,b)):""}

/* ---------- umum ---------- */
var toastT;
function toast(msg,bad){var t=$("toast");t.textContent=msg;t.className="show"+(bad?" bad":"");clearTimeout(toastT);toastT=setTimeout(function(){t.className=""},3500)}
function errMsg(e){var m=(e&&e.message)||String(e);if(/failed to fetch|network|load failed/i.test(m))return "Tidak ada koneksi internet";return m}
function openSheet(html){$("sheet-body").innerHTML=html;$("sheet").classList.add("open")}
function closeSheet(){$("sheet").classList.remove("open");$("sheet-body").innerHTML="";cur=null}
$("sheet").onclick=function(e){if(e.target===this)closeSheet()};
$("viewer").onclick=function(){this.classList.remove("open");this.innerHTML=""};

/* ---------- login ---------- */
function showLogin(){
  me=null;loadId++;
  $("hd").classList.add("hide");$("nav").classList.add("hide");$("fab").classList.add("hide");
  $("main").innerHTML="";$("login").classList.remove("hide");closeSheet();
}
async function doLogin(){
  var em=$("l-email").value.trim(),pw=$("l-pass").value;
  if(!em||!pw){$("l-err").textContent="Isi email dan kata sandi";return}
  $("btn-login").disabled=true;$("l-err").textContent="";
  try{
    var r=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error)throw r.error;
    await enter(r.data.user);
    $("l-pass").value="";
  }catch(e){
    $("l-err").textContent=/invalid/i.test((e&&e.message)||"")?"Email atau kata sandi salah":errMsg(e);
  }
  $("btn-login").disabled=false;
}
$("btn-login").onclick=doLogin;
$("l-pass").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});
$("btn-out").onclick=function(){sb.auth.signOut()};
$("btn-ref").onclick=function(){if(me)load()};

async function enter(user){
  var r=await sb.from("profiles").select("id,nama,role,aktif").eq("id",user.id).maybeSingle();
  if(r.error)throw r.error;
  if(!r.data||!r.data.aktif){await sb.auth.signOut();throw new Error("Akun belum aktif. Hubungi pemilik.")}
  me=r.data;
  $("login").classList.add("hide");$("hd").classList.remove("hide");$("nav").classList.remove("hide");
  $("who").textContent=me.nama;$("role").textContent=me.role==="owner"?"Pemilik":"Karyawan";
  dateSel=todayWIB();monthSel=dateSel.slice(0,7);expanded={};
  setTab(me.role==="owner"?"ringkas":"hari");
}

/* ---------- navigasi ---------- */
function renderNav(){
  var items=me.role==="owner"
    ?[["ringkas","Ringkasan","📋"],["absen","Absensi","🗓"],["tim","Tim","👥"]]
    :[["hari","Hari ini","✅"],["riwayat","Riwayat","🕘"]];
  $("nav").innerHTML=items.map(function(i){return '<button data-t="'+i[0]+'" class="'+(i[0]===tab?"on":"")+'"><b>'+i[2]+'</b>'+i[1]+'</button>'}).join("");
}
function setTab(t){
  tab=t;renderNav();
  $("fab").classList.toggle("hide",!(me.role==="owner"&&t==="ringkas"));
  window.scrollTo(0,0);load();
}
$("nav").onclick=function(e){var b=e.target.closest("button");if(b&&me)setTab(b.dataset.t)};

async function load(){
  var my=++loadId;
  $("main").innerHTML='<div class="empty">Memuat…</div>';
  try{
    var html="";
    if(tab==="hari")html=await loadHari();
    else if(tab==="riwayat")html=await loadRiwayat();
    else if(tab==="ringkas")html=await loadRingkas();
    else if(tab==="absen")html=await loadAbsen();
    else if(tab==="tim")html=await loadTim();
    if(my===loadId)$("main").innerHTML=html;
  }catch(e){
    if(my===loadId)$("main").innerHTML='<div class="card"><div class="title">Gagal memuat data</div><div class="meta" style="margin:4px 0 10px">'+esc(errMsg(e))+'</div><button class="btn" data-act="reload">Coba lagi</button></div>';
  }
}
function must(r){if(r.error)throw r.error;return r.data}

/* ---------- karyawan: hari ini ---------- */
function taskRow(t){
  return '<div class="card row'+(t.selesai?' done':'')+'"><button class="chk'+(t.selesai?' on':'')+'" data-act="toggle" data-id="'+t.id+'" aria-label="Selesai">'+(t.selesai?'✓':'')+'</button>'+
    '<div class="grow" data-act="open" data-id="'+t.id+'"><div class="title">'+esc(t.judul)+'</div>'+
    ((t.catatan||t.foto_path)?'<div class="meta">'+(t.catatan?'Ada catatan ':'')+(t.foto_path?'· Ada foto':'')+'</div>':'')+'</div></div>';
}
async function loadHari(){
  var hari=todayWIB();
  var rs=await Promise.all([
    sb.from("absensi").select("*").eq("user_id",me.id).eq("tanggal",hari).maybeSingle(),
    sb.from("tugas").select("*").eq("user_id",me.id).eq("tanggal",hari).order("dibuat")
  ]);
  var a=must(rs[0]),ts=must(rs[1])||[];
  ts.forEach(function(t){cache.tasks[t.id]=t});
  var st,btn="";
  if(!a){st="Belum absen masuk";btn='<button class="btn big" data-act="masuk">Absen masuk</button>'}
  else if(!a.pulang){st="Masuk pukul "+jam(a.masuk);btn='<button class="btn big" data-act="pulang">Absen pulang</button>'}
  else{st="Selesai hari ini";btn='<div class="meta">Masuk '+jam(a.masuk)+' · Pulang '+jam(a.pulang)+' · '+durasi(a.masuk,a.pulang)+'</div>'}
  var done=ts.filter(function(t){return t.selesai}).length;
  var h='<p class="sub">'+esc(tglID(hari))+'</p>';
  h+='<div class="card"><div class="meta">Absensi</div><div class="stat">'+esc(st)+'</div>'+btn+'</div>';
  h+='<div class="sec">Tugas hari ini ('+done+'/'+ts.length+')</div>';
  h+='<div class="card row"><input id="in-task" placeholder="Tulis tugas baru" maxlength="200"><button class="btn" data-act="addtask">Tambah</button></div>';
  h+=ts.length?ts.map(taskRow).join(""):'<div class="empty">Belum ada tugas hari ini.</div>';
  return h;
}
async function loadRiwayat(){
  var rows=must(await sb.from("absensi").select("*").eq("user_id",me.id).order("tanggal",{ascending:false}).limit(31))||[];
  var h='<p class="sub">Riwayat absensi 31 hari terakhir</p>';
  if(!rows.length)return h+'<div class="empty">Belum ada absensi.</div>';
  return h+rows.map(function(x){
    return '<div class="card"><div class="row"><div class="grow title">'+esc(tglPendek(x.tanggal))+'</div><div class="meta">'+esc(durasi(x.masuk,x.pulang))+'</div></div><div class="meta">Masuk '+jam(x.masuk)+' · '+(x.pulang?'Pulang '+jam(x.pulang):'belum absen pulang')+'</div></div>';
  }).join("");
}

/* ---------- pemilik: ringkasan harian ---------- */
async function loadRingkas(){
  var d=dateSel;
  var rs=await Promise.all([
    sb.from("profiles").select("id,nama,role,aktif").eq("role","karyawan").eq("aktif",true).order("nama"),
    sb.from("absensi").select("*").eq("tanggal",d),
    sb.from("tugas").select("*").eq("tanggal",d).order("dibuat")
  ]);
  cache.ring={d:d,p:must(rs[0])||[],a:must(rs[1])||[],t:must(rs[2])||[]};
  cache.profiles=cache.ring.p;
  cache.ring.t.forEach(function(t){cache.tasks[t.id]=t});
  return viewRingkas();
}
function viewRingkas(){
  var R=cache.ring,d=R.d,hadir=0,tot=0,sel=0;
  var cards=R.p.map(function(p){
    var a=R.a.filter(function(x){return x.user_id===p.id})[0];
    var ts=R.t.filter(function(x){return x.user_id===p.id});
    var s=ts.filter(function(x){return x.selesai}).length;
    if(a)hadir++;tot+=ts.length;sel+=s;
    var badge=!a?'<span class="badge warn">Belum masuk</span>':a.pulang?'<span class="badge">Pulang '+jam(a.pulang)+'</span>':'<span class="badge ok">Masuk '+jam(a.masuk)+'</span>';
    var pct=ts.length?Math.round(s/ts.length*100):0;
    var c='<div class="card"><div class="row" data-act="exp" data-id="'+p.id+'" style="cursor:pointer"><div class="grow"><div class="title">'+esc(p.nama)+'</div><div class="meta">Tugas '+s+' dari '+ts.length+' selesai</div></div>'+badge+'</div><div class="bar"><i style="width:'+pct+'%"></i></div>';
    if(expanded[p.id]){
      c+=ts.length?ts.map(function(t){
        return '<div class="sub-row'+(t.selesai?' done':'')+'" data-act="open" data-id="'+t.id+'"><span class="dot'+(t.selesai?' on':'')+'"></span><div class="grow"><div class="title">'+esc(t.judul)+'</div>'+((t.catatan||t.foto_path)?'<div class="meta">'+(t.catatan?'Ada catatan ':'')+(t.foto_path?'· Ada foto':'')+'</div>':'')+'</div></div>';
      }).join(""):'<div class="meta" style="margin-top:8px">Belum ada tugas.</div>';
    }
    return c+'</div>';
  }).join("");
  var h='<div class="row" style="margin:6px 0 10px"><button class="icon" data-act="dprev" aria-label="Hari sebelumnya">‹</button><div class="grow" style="text-align:center"><div class="title">'+esc(tglID(d))+'</div>'+(d!==todayWIB()?'<button class="chip" data-act="dtoday">Ke hari ini</button>':'')+'</div><button class="icon" data-act="dnext" aria-label="Hari berikutnya">›</button></div>';
  h+='<div class="metrics"><div class="metric"><span class="meta">Hadir</span><b>'+hadir+' / '+R.p.length+'</b></div><div class="metric"><span class="meta">Tugas selesai</span><b>'+sel+' / '+tot+'</b></div></div>';
  if(!R.p.length)return h+'<div class="empty">Belum ada karyawan aktif.<br>Lihat tab Tim untuk cara menambahkan.</div>';
  return h+cards;
}

/* ---------- pemilik: rekap bulanan ---------- */
async function loadAbsen(){
  var ym=monthSel;
  var rs=await Promise.all([
    sb.from("profiles").select("id,nama,role,aktif").eq("role","karyawan").order("nama"),
    sb.from("absensi").select("*").gte("tanggal",ym+"-01").lte("tanggal",lastDay(ym)).order("tanggal")
  ]);
  cache.abs={ym:ym,p:must(rs[0])||[],a:must(rs[1])||[]};
  return viewAbsen();
}
function viewAbsen(){
  var R=cache.abs;
  var h='<div class="row" style="margin:6px 0 10px"><button class="icon" data-act="mprev" aria-label="Bulan sebelumnya">‹</button><div class="grow title" style="text-align:center">'+esc(bulanID(R.ym))+'</div><button class="icon" data-act="mnext" aria-label="Bulan berikutnya">›</button></div>';
  if(!R.p.length)return h+'<div class="empty">Belum ada karyawan.</div>';
  return h+R.p.map(function(p){
    var rows=R.a.filter(function(x){return x.user_id===p.id});
    var mins=0,open=0;
    rows.forEach(function(x){if(x.pulang)mins+=menit(x.masuk,x.pulang);else open++});
    var key="a"+p.id;
    var c='<div class="card"><div class="row" data-act="expa" data-id="'+key+'" style="cursor:pointer"><div class="grow"><div class="title">'+esc(p.nama)+(p.aktif?'':' (nonaktif)')+'</div><div class="meta">Hadir '+rows.length+' hari · Total '+lamaMenit(mins)+(open?' · '+open+' belum pulang':'')+'</div></div><span class="meta">'+(expanded[key]?'▲':'▼')+'</span></div>';
    if(expanded[key]){
      c+=rows.length?rows.map(function(x){
        return '<div class="sub-row" style="cursor:default"><div class="grow"><div class="title">'+esc(tglPendek(x.tanggal))+'</div><div class="meta">Masuk '+jam(x.masuk)+' · '+(x.pulang?'Pulang '+jam(x.pulang):'belum absen pulang')+'</div></div><div class="meta">'+esc(durasi(x.masuk,x.pulang))+'</div></div>';
      }).join(""):'<div class="meta" style="margin-top:8px">Tidak ada absensi bulan ini.</div>';
    }
    return c+'</div>';
  }).join("");
}

/* ---------- pemilik: tim ---------- */
async function loadTim(){
  var rows=must(await sb.from("profiles").select("id,nama,role,aktif").order("role",{ascending:false}).order("nama"))||[];
  cache.tim=rows;
  var h='<div class="card"><div class="title">Menambah karyawan</div><div class="meta" style="margin-top:4px">Buka dashboard Supabase, lalu Authentication, Users, Add user. Isi email dan kata sandi, centang Auto Confirm User. Setelah muncul di daftar ini, ketuk namanya untuk mengganti nama.</div></div>';
  h+='<div class="sec">Anggota ('+rows.length+')</div>';
  return h+rows.map(function(p){
    return '<div class="card row" data-act="member" data-id="'+p.id+'" style="cursor:pointer"><div class="grow"><div class="title">'+esc(p.nama)+'</div><div class="meta">'+(p.role==="owner"?"Pemilik":"Karyawan")+'</div></div>'+(p.aktif?'<span class="badge ok">Aktif</span>':'<span class="badge warn">Nonaktif</span>')+'</div>';
  }).join("");
}

/* ---------- aksi di halaman utama ---------- */
$("main").onclick=async function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.dataset.act,id=el.dataset.id;
  try{
    if(act==="reload"){load()}
    else if(act==="masuk"){
      el.disabled=true;must(await sb.rpc("absen_masuk"));toast("Absen masuk tercatat");load();
    }
    else if(act==="pulang"){
      if(!el.dataset.armed){
        el.dataset.armed="1";el.textContent="Ketuk lagi untuk konfirmasi pulang";
        setTimeout(function(){if(el.isConnected){delete el.dataset.armed;el.textContent="Absen pulang"}},4000);
        return;
      }
      el.disabled=true;must(await sb.rpc("absen_pulang"));toast("Absen pulang tercatat");load();
    }
    else if(act==="addtask"){
      var inp=$("in-task"),v=inp.value.trim();
      if(!v){inp.focus();return}
      el.disabled=true;must(await sb.from("tugas").insert({user_id:me.id,judul:v}));load();
    }
    else if(act==="toggle"){
      var t=cache.tasks[id];if(!t)return;
      el.disabled=true;must(await sb.from("tugas").update({selesai:!t.selesai}).eq("id",id));load();
    }
    else if(act==="open"){openTask(id)}
    else if(act==="exp"){expanded[id]=!expanded[id];$("main").innerHTML=viewRingkas()}
    else if(act==="expa"){expanded[id]=!expanded[id];$("main").innerHTML=viewAbsen()}
    else if(act==="dprev"){dateSel=addDays(dateSel,-1);load()}
    else if(act==="dnext"){dateSel=addDays(dateSel,1);load()}
    else if(act==="dtoday"){dateSel=todayWIB();load()}
    else if(act==="mprev"){monthSel=addMonth(monthSel,-1);load()}
    else if(act==="mnext"){monthSel=addMonth(monthSel,1);load()}
    else if(act==="member"){openMember(id)}
  }catch(err){
    toast(errMsg(err),true);
    if(el.isConnected)el.disabled=false;
  }
};
$("main").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="in-task"){var b=$("main").querySelector('[data-act="addtask"]');if(b)b.click()}
});
$("fab").onclick=function(){openAssign()};

/* ---------- lembar: detail tugas ---------- */
function openTask(id){
  var t=cache.tasks[id];if(!t)return;
  cur=id;
  var mine=t.user_id===me.id,owner=me.role==="owner",who="";
  if(owner){var p=(cache.profiles||[]).filter(function(x){return x.id===t.user_id})[0];who=p?p.nama:""}
  var h='<h1 style="font-size:18px;margin:0 0 4px;overflow-wrap:anywhere">'+esc(t.judul)+'</h1><div class="meta">'+esc(tglID(t.tanggal))+(who?' · '+esc(who):'')+'</div>';
  h+='<label class="chkrow"><input type="checkbox" id="t-done"'+(t.selesai?' checked':'')+(mine?'':' disabled')+'> Selesai'+(t.selesai_at?' · '+jam(t.selesai_at):'')+'</label>';
  h+='<label>Catatan</label><textarea id="t-note" rows="3" maxlength="2000"'+(mine?'':' disabled')+'>'+esc(t.catatan||"")+'</textarea>';
  h+='<label>Foto bukti</label><div id="foto-area" class="meta">'+(t.foto_path?'Memuat foto…':'Belum ada foto')+'</div>';
  if(mine)h+='<input type="file" id="f-foto" accept="image/*" class="hide"><button class="btn ghost" data-act="foto" style="margin-top:8px">'+(t.foto_path?'Ganti foto':'Ambil foto')+'</button>';
  h+='<div class="row" style="margin-top:16px">';
  if(mine||owner)h+='<button class="btn ghost" data-act="deltask" style="color:var(--bad)">Hapus</button>';
  h+='<button class="btn ghost grow" data-act="close">Tutup</button>'+(mine?'<button class="btn grow" data-act="savetask">Simpan</button>':'')+'</div>';
  openSheet(h);
  if(t.foto_path)showFoto(t.foto_path,id);
}
async function showFoto(path,forId){
  var r=await sb.storage.from("bukti").createSignedUrl(path,3600);
  var box=$("foto-area");
  if(!box||cur!==forId)return;
  if(r.error||!r.data){box.textContent="Foto tidak bisa dimuat";return}
  box.innerHTML='<img class="thumb" alt="Foto bukti" src="'+esc(r.data.signedUrl)+'" data-act="viewfoto" data-url="'+esc(r.data.signedUrl)+'">';
}
function kecil(f){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(f),img=new Image();
    img.onload=function(){
      var m=1280,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,m/Math.max(w,h));
      var c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej(new Error("Gagal memproses foto"))},"image/jpeg",0.72);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("File bukan gambar yang valid"))};
    img.src=url;
  });
}
$("sheet-body").addEventListener("change",async function(e){
  if(e.target.id!=="f-foto")return;
  var f=e.target.files[0],id=cur;
  if(!f||!id)return;
  var t=cache.tasks[id];
  try{
    toast("Mengunggah foto…");
    var blob=await kecil(f);
    var path=me.id+"/"+t.id+"_"+Date.now()+".jpg";
    var up=await sb.storage.from("bukti").upload(path,blob,{contentType:"image/jpeg"});
    if(up.error)throw up.error;
    var old=t.foto_path;
    var u=await sb.from("tugas").update({foto_path:path}).eq("id",t.id);
    if(u.error){await sb.storage.from("bukti").remove([path]);throw u.error}
    if(old)await sb.storage.from("bukti").remove([old]);
    t.foto_path=path;
    toast("Foto tersimpan");
    var box=$("foto-area");
    if(box&&cur===id){box.textContent="Memuat foto…";showFoto(path,id)}
    load();
  }catch(err){toast(errMsg(err),true)}
  e.target.value="";
});

/* ---------- lembar: beri tugas, anggota ---------- */
function openAssign(){
  var P=cache.profiles||[];
  if(!P.length){toast("Belum ada karyawan aktif",true);return}
  var h='<h1 style="font-size:18px;margin:0 0 4px">Beri tugas</h1>';
  h+='<label>Karyawan</label><select id="a-who">'+P.map(function(p){return '<option value="'+p.id+'">'+esc(p.nama)+'</option>'}).join("")+'</select>';
  h+='<label>Tanggal</label><input type="date" id="a-date" value="'+esc(dateSel)+'">';
  h+='<label>Tugas</label><input id="a-judul" maxlength="200" placeholder="Contoh: Packing pesanan 20 dus">';
  h+='<div class="row" style="margin-top:16px"><button class="btn ghost grow" data-act="close">Batal</button><button class="btn grow" data-act="saveassign">Simpan</button></div>';
  openSheet(h);
}
function openMember(id){
  var p=cache.tim.filter(function(x){return x.id===id})[0];if(!p)return;
  cur=id;
  var self=p.id===me.id;
  var h='<h1 style="font-size:18px;margin:0 0 4px">Ubah anggota</h1>';
  h+='<label>Nama</label><input id="m-nama" maxlength="60" value="'+esc(p.nama)+'">';
  if(!self)h+='<label class="chkrow"><input type="checkbox" id="m-aktif"'+(p.aktif?' checked':'')+'> Akun aktif</label><div class="meta" style="margin-top:4px">Akun nonaktif tidak bisa masuk atau absen.</div>';
  h+='<div class="row" style="margin-top:16px"><button class="btn ghost grow" data-act="close">Batal</button><button class="btn grow" data-act="savemember">Simpan</button></div>';
  openSheet(h);
}

$("sheet-body").onclick=async function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.dataset.act;
  try{
    if(act==="close"){closeSheet()}
    else if(act==="foto"){$("f-foto").click()}
    else if(act==="viewfoto"){var v=$("viewer");v.innerHTML='<img alt="Foto bukti" src="'+el.dataset.url+'">';v.classList.add("open")}
    else if(act==="savetask"){
      el.disabled=true;
      var note=$("t-note").value.trim();
      must(await sb.from("tugas").update({selesai:$("t-done").checked,catatan:note||null}).eq("id",cur));
      toast("Tersimpan");closeSheet();load();
    }
    else if(act==="deltask"){
      if(!el.dataset.armed){
        el.dataset.armed="1";el.textContent="Ketuk lagi";
        setTimeout(function(){if(el.isConnected){delete el.dataset.armed;el.textContent="Hapus"}},4000);
        return;
      }
      el.disabled=true;
      var t=cache.tasks[cur];
      must(await sb.from("tugas").delete().eq("id",cur));
      if(t&&t.foto_path)await sb.storage.from("bukti").remove([t.foto_path]);
      toast("Tugas dihapus");closeSheet();load();
    }
    else if(act==="saveassign"){
      var judul=$("a-judul").value.trim(),tgl=$("a-date").value;
      if(!judul){$("a-judul").focus();return}
      if(!tgl){toast("Pilih tanggal",true);return}
      el.disabled=true;
      must(await sb.from("tugas").insert({user_id:$("a-who").value,tanggal:tgl,judul:judul}));
      toast("Tugas diberikan");closeSheet();
      if(tgl!==dateSel)dateSel=tgl;
      load();
    }
    else if(act==="savemember"){
      var nama=$("m-nama").value.trim();
      if(!nama){$("m-nama").focus();return}
      var patch={nama:nama},ck=$("m-aktif");
      if(ck)patch.aktif=ck.checked;
      el.disabled=true;
      must(await sb.from("profiles").update(patch).eq("id",cur));
      toast("Tersimpan");closeSheet();load();
    }
  }catch(err){
    toast(errMsg(err),true);
    if(el.isConnected)el.disabled=false;
  }
};

/* ---------- mulai ---------- */
async function boot(){
  if(!window.supabase){
    $("login").classList.remove("hide");
    $("l-err").textContent="Gagal memuat. Periksa koneksi internet lalu buka ulang aplikasi.";
    $("btn-login").disabled=true;
    return;
  }
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT")showLogin()});
  try{
    var r=await sb.auth.getSession();
    if(r.data&&r.data.session){await enter(r.data.session.user);return}
  }catch(e){
    $("login").classList.remove("hide");
    $("l-err").textContent=errMsg(e);
    return;
  }
  $("login").classList.remove("hide");
}
setInterval(function(){
  if(me&&me.role==="owner"&&tab==="ringkas"&&!document.hidden&&!$("sheet").classList.contains("open"))load();
},60000);
boot();

if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
